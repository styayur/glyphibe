name: Closeout dependency inventory candidate
on:
  push:
    branches: [codex/dependency-compat-20261102]
permissions:
  contents: read
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
        working-directory: apps/desktop
      - run: python scripts/audit-dependencies.py --fetch-missing-license-texts
      - run: python scripts/audit-dependencies.py --check
      - uses: actions/upload-artifact@v7
        with:
          name: reviewed-dependency-inventory-${{ github.sha }}
          if-no-files-found: error
          path: |
            docs/development/dependency-inventory.json
            THIRD_PARTY_NOTICES*
            third-party/licenses/**
