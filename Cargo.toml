[workspace]
resolver = "2"
members = ["crates/*", "apps/desktop/src-tauri"]

[workspace.package]
version = "1.0.0"
edition = "2024"
rust-version = "1.98"
license = "MPL-2.0"
repository = "https://github.com/styayur/glyphibe"
authors = ["Glyphibe contributors"]

[workspace.dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3.23"
rusqlite = { version = "0.41", default-features = false, features = ["bundled", "libsqlite3-sys"] }
tree-sitter = "=0.27.1"
tree-sitter-python = "=0.25.0"
tree-sitter-rust = "=0.24.2"
tree-sitter-javascript = "=0.25.0"
tree-sitter-typescript = "=0.23.2"
ignore = "0.4"
url = "2.5"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls"] }
clap = { version = "4.5", features = ["derive"] }
tokio = { version = "1.48", features = ["macros", "rt-multi-thread", "io-std", "process", "signal"] }
rmcp = { version = "=3.8.0", features = ["server", "client", "transport-io", "transport-child-process"] }
schemars = "1.0"

[profile.dev]
debug = 0
incremental = false

[profile.release]
lto = "thin"
strip = true
codegen-units = 1

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
